name: hosts

on:
  push:
    paths:
      - 'hosts/**'
      - 'frontend/src/platform/**'
      - '.github/workflows/hosts.yml'
  pull_request:
    paths:
      - 'hosts/**'
      - 'frontend/src/platform/**'
      - '.github/workflows/hosts.yml'

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosts/wails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hosts/wails/go.mod
          cache-dependency-path: hosts/wails/go.sum
      - name: Install GTK/WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet -tags gtk3 ./...
      - run: go build -tags gtk3 ./...
      - run: go test -race ./internal/...

  tauri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosts/tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install webkit2gtk deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/tauri/src-tauri
      # tauri-build validates that frontendDist (frontend/dist) exists
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: cargo check --locked

  # The macOS code paths (cgo darwin, private APIs, cfg(macos) Rust) are what the hosts exist for.
  wails-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: hosts/wails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hosts/wails/go.mod
          cache-dependency-path: hosts/wails/go.sum
      - run: go vet -tags private_mac_apis ./...
      - run: go build -tags production,private_mac_apis ./...
      - run: go test -race ./...

  tauri-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: hosts/tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: cargo check --locked
