name: tauri

on:
  push:
    paths:
      - 'src-tauri/**'
      - 'src/platform/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/platform/**'
      - '.github/workflows/tauri.yml'

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install webkit2gtk deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build validates that frontendDist (dist) exists
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run build
        working-directory: .
      - run: cargo check --locked

  # The macOS code paths (private APIs, cfg(macos) Rust) are what the host exists for.
  tauri-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run build
        working-directory: .
      - run: cargo check --locked
