name: update-visual-baselines

# Manual: regenerates the Playwright baselines on the CI runner and opens a PR with the changed PNGs.
# Review the images in the PR diff, then merge. The tests pin the UI font (tests-visual/fixtures.ts),
# so baselines made locally normally match CI; use this when they do not, or after a visual change.
# Note: PRs opened with GITHUB_TOKEN do not trigger other workflows, so `visual` runs once merged.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Open a PR with the changed baselines
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          dir=tests-visual/__screenshots__
          if git diff --quiet -- "$dir" && [ -z "$(git ls-files --others --exclude-standard -- "$dir")" ]; then
            echo "Baselines unchanged; nothing to do."
            exit 0
          fi
          branch="chore/visual-baselines-${{ github.run_id }}"
          git config user.name "Paul Onutor"
          git config user.email "paul@onutor.de"
          git checkout -b "$branch"
          git add "$dir"
          git commit -m "Update visual baselines (regenerated on the CI runner)"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "Update visual baselines" \
            --body "Regenerated by the update-visual-baselines workflow. Look at the changed PNGs in the diff before merging. The visual job does not run on this PR (GITHUB_TOKEN limitation); it runs on main after the merge."
