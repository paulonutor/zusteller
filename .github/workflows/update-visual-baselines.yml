name: update-visual-baselines

# Manual: regenerates the Playwright baselines on the CI runner (its fonts/rasteriser are the
# reference for the `visual` job) and uploads them as an artifact. Nothing is committed; download
# the artifact, replace tests-visual/__screenshots__/, review the PNGs and commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests-visual/__screenshots__
          retention-days: 14
