[package]
name = "zusteller"
version = "0.1.0"
description = "zusteller Tauri host (thin shell around the shared frontend)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zusteller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"
