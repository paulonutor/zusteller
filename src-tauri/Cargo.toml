[package]
name = "zusteller"
version = "0.1.0"
description = "zusteller Tauri host (thin shell around the shared frontend)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zusteller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
mailparse = "0.15"
encoding_rs = "0.8"
html-escape = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-dialog = "2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions as tauri's own tree (no duplicate compile). Only used to read the system accent colour.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
