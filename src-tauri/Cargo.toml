[package]
name = "zusteller"
version = "0.1.0"
description = "zusteller Tauri host (thin shell around the shared frontend)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zusteller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions as tauri's own tree (no duplicate compile). Only used to read the system accent colour.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace"] }
